/*
 * Icinga 2 configuration for alertmanager-icinga-bridge, started with
 *   --id=k8s
 *   --host-templates=alertmanager-host
 *   --templates=alertmanager-service
 * (and the defaults --icinga-hostname=alertmanager-bridge, --host-labels=cluster,project).
 *
 * The bridge creates everything else itself and marks it with
 * vars.bridge_uuid = "k8s":
 *   - the host "alertmanager-bridge" with the service "heartbeat"
 *   - a host per cluster/project (e.g. "xraydmz2-system") with a service per alert
 *   - with polling, the service "alertmanager" on each cluster's host
 */

/*
 * Template for the hosts the bridge creates. The bridge sets display_name,
 * check_command (--host-check-command, default "dummy") and these vars:
 *   vars.cluster, vars.project     label values after mapping
 *   vars.project_source            original value of a mapped label (p-q2v7w)
 *   vars.bridge_uuid               --id of the bridge (used for permissions and removal)
 *   vars.bridge_created            creation time (Unix seconds)
 *   vars.bridge_kind = "bridge"    only on alertmanager-bridge
 */
template Host "alertmanager-host" {
  check_command = "dummy"
  check_interval = 5m
  enable_perfdata = false

  vars.dummy_state = 0
  vars.dummy_text = "Host managed by alertmanager-icinga-bridge"
}

/* Template for the services the bridge creates (alerts, heartbeat, Alertmanager health) */
template Service "alertmanager-service" {
  enable_perfdata = false
}

/* Group the created hosts by cluster and project, e.g. for dashboards and notifications */
object HostGroup "alertmanager-hosts" {
  display_name = "Kubernetes (Alertmanager)"
  assign where host.vars.bridge_uuid == "k8s"
}

object HostGroup "cluster-xraydmz2" {
  assign where host.vars.cluster == "xraydmz2"
}

object HostGroup "project-system" {
  assign where host.vars.project == "system"
}

/*
 * API user, limited to the objects of the bridge (vars.bridge_uuid). If you
 * create the host "alertmanager-bridge" yourself, set vars.bridge_uuid = "k8s"
 * on it too. Hosts named with an icinga_use_host label need their own
 * permissions.
 */
object ApiUser "alertmanager-bridge" {
  password = "CHANGEME"

  permissions = [
    {
      /* Needed for the filters the bridge sends */
      permission = "filter-expression"
    },
    {
      permission = "objects/query/*"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
    {
      permission = "objects/create/host"
    },
    {
      permission = "objects/delete/host"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
    {
      permission = "objects/create/service"
    },
    {
      permission = "objects/modify/service"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
    {
      permission = "objects/delete/service"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
    {
      permission = "actions/process-check-result"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
    /* Polling: silences become downtimes (author "alertmanager-icinga-bridge/k8s") */
    {
      permission = "actions/schedule-downtime"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
    {
      permission = "actions/remove-downtime"
      filter = {{ host.vars.bridge_uuid == "k8s" }}
    },
  ]
}
